<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
  <title>DawaHub 관리자 | 후기 관리</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans KR','sans-serif']},colors:{antique:'#D4AF37'}}}};</script>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-100 font-sans text-slate-900 antialiased">
  <div id="login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-5"><div class="w-full max-w-sm border border-white/10 bg-slate-900 p-7 shadow-2xl"><a href="index.html" class="text-sm font-bold text-slate-400">← 랜딩페이지</a><p class="mt-7 text-xs font-black text-antique">DAWAHUB ADMIN</p><h1 class="mt-1 text-2xl font-black text-white">후기 관리 로그인</h1><form id="login-form" class="mt-7 space-y-4"><input id="identifier" required autocomplete="username" placeholder="관리자 아이디" class="min-h-12 w-full border border-slate-700 bg-slate-950 px-4 font-bold text-white outline-none focus:border-antique"><input id="password" type="password" required autocomplete="current-password" placeholder="비밀번호" class="min-h-12 w-full border border-slate-700 bg-slate-950 px-4 font-bold text-white outline-none focus:border-antique"><p id="login-error" class="hidden text-sm font-bold text-rose-400" role="alert"></p><button id="login-button" class="min-h-12 w-full bg-emerald-600 font-black text-white">로그인</button></form></div></div>

  <div id="app" class="hidden">
    <header class="bg-slate-950 text-white"><div class="mx-auto flex min-h-16 max-w-7xl flex-col justify-between gap-2 px-4 py-3 sm:flex-row sm:items-center sm:px-8 sm:py-0"><div><p class="font-black">전남광주<span class="text-antique">골동품</span></p><p class="text-xs text-slate-400">후기 검수·공개 관리</p></div><div class="flex flex-wrap gap-1"><a href="admin.html" class="inline-flex min-h-10 items-center px-3 text-sm font-bold text-slate-300">견적 관리</a><a href="admin-blog.html" class="inline-flex min-h-10 items-center px-3 text-sm font-bold text-antique">블로그 수집</a><a href="reviews.html" target="_blank" class="inline-flex min-h-10 items-center px-3 text-sm font-bold text-slate-300">공개 페이지</a><button id="logout" class="min-h-10 border border-slate-700 px-3 text-sm font-bold">로그아웃</button></div></div></header>
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-8 lg:py-10">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-sm font-black text-emerald-700">VERIFIED REVIEWS</p><h2 class="mt-1 text-3xl font-black">후기 등록 및 검수</h2><p class="mt-2 text-sm font-medium text-slate-500">출처를 확인한 후기만 공개로 전환하세요.</p></div><button id="new-review" type="button" class="min-h-11 bg-slate-900 px-5 font-black text-white">새 후기 작성</button></div>
      <div class="mt-7 grid gap-4 sm:grid-cols-3"><article class="border border-slate-200 bg-white p-5"><p class="text-sm font-bold text-slate-500">전체</p><p id="stat-total" class="mt-2 text-3xl font-black">0</p></article><article class="border border-amber-200 bg-white p-5"><p class="text-sm font-bold text-amber-700">검수 대기</p><p id="stat-draft" class="mt-2 text-3xl font-black text-amber-600">0</p></article><article class="border border-emerald-200 bg-white p-5"><p class="text-sm font-bold text-emerald-700">공개</p><p id="stat-published" class="mt-2 text-3xl font-black text-emerald-600">0</p></article></div>

      <section id="editor" class="mt-7 hidden border border-slate-200 bg-white p-5 shadow-sm sm:p-7" aria-labelledby="editor-title"><div class="flex items-center justify-between"><h3 id="editor-title" class="text-xl font-black">후기 작성</h3><button id="close-editor" type="button" class="min-h-10 px-3 font-black text-slate-500">닫기</button></div><form id="review-form" class="mt-6 grid gap-5 lg:grid-cols-2"><input id="review-id" type="hidden"><label class="font-bold">제목<input id="title" required minlength="2" maxlength="120" class="mt-2 min-h-11 w-full border border-slate-300 px-3 font-medium"></label><label class="font-bold">카테고리<input id="category" required maxlength="80" placeholder="예: 유품정리 및 고가구 매입 사례" class="mt-2 min-h-11 w-full border border-slate-300 px-3 font-medium"></label><label class="font-bold">서비스<select id="service-type" class="mt-2 min-h-11 w-full border border-slate-300 px-3"><option>골동품 매입</option><option>빈집·유품정리</option><option>특수청소</option><option>복합 서비스</option></select></label><label class="font-bold">지역<input id="region" required maxlength="80" placeholder="예: 광주 북구" class="mt-2 min-h-11 w-full border border-slate-300 px-3 font-medium"></label><label class="font-bold">고객 표기<input id="author" required value="고객님" maxlength="40" placeholder="예: 김OO 고객님" class="mt-2 min-h-11 w-full border border-slate-300 px-3 font-medium"></label><label class="font-bold">별점<select id="rating" class="mt-2 min-h-11 w-full border border-slate-300 px-3"><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select></label><label class="font-bold">출처 유형<select id="source-type" class="mt-2 min-h-11 w-full border border-slate-300 px-3"><option value="DIRECT">직접 받은 후기</option><option value="BLOG_COMMENT">블로그 댓글</option><option value="WORK_CASE">작업 사례</option></select></label><label class="font-bold">정렬 순서<input id="sort-order" type="number" value="0" class="mt-2 min-h-11 w-full border border-slate-300 px-3"></label><label class="font-bold lg:col-span-2">후기 내용<textarea id="review-body" required minlength="10" maxlength="1200" rows="5" class="mt-2 w-full border border-slate-300 p-3 font-medium leading-7"></textarea></label><label class="font-bold">이미지 경로 또는 URL<input id="image-url" maxlength="500" placeholder="images/cases/example.jpg" class="mt-2 min-h-11 w-full border border-slate-300 px-3 font-medium"></label><label class="font-bold">출처 URL<input id="source-url" type="url" maxlength="500" placeholder="https://..." class="mt-2 min-h-11 w-full border border-slate-300 px-3 font-medium"></label><label class="flex items-center gap-3 font-black lg:col-span-2"><input id="published" type="checkbox" class="h-5 w-5 accent-emerald-600"> 검수 완료 후 공개</label><div class="flex gap-3 lg:col-span-2"><button id="save-button" class="min-h-12 bg-emerald-600 px-6 font-black text-white">저장하기</button><button id="cancel-button" type="button" class="min-h-12 border border-slate-300 px-6 font-black">취소</button></div></form></section>

      <section class="mt-7 border border-slate-200 bg-white shadow-sm"><div class="flex flex-col gap-3 border-b border-slate-200 p-5 sm:flex-row sm:items-center sm:justify-between"><div><h3 class="font-black">등록된 후기</h3><p id="result-count" class="mt-1 text-xs font-bold text-slate-500">0건</p></div><select id="status-filter" class="min-h-10 border border-slate-300 px-3 font-bold"><option value="ALL">전체 상태</option><option value="DRAFT">검수 대기</option><option value="PUBLISHED">공개</option></select></div><div id="review-list" class="divide-y divide-slate-100"><p class="p-10 text-center font-bold text-slate-500">로그인 후 데이터를 불러옵니다.</p></div></section>
    </main>
  </div>
  <div id="toast" class="fixed right-4 top-4 z-[70] hidden max-w-sm bg-emerald-700 px-4 py-3 text-sm font-bold text-white shadow-xl" role="status"></div>

  <script>
    (()=>{
      const URL='https://iokhvcxbgmdxntlbnopk.supabase.co', KEY='sb_publishable_hKShxHDRNY7b915FX6O5bw_YQmIHXoF';
      const client=window.supabase.createClient(URL,KEY); let reviews=[];
      const $=(s)=>document.querySelector(s), els={login:$('#login'),app:$('#app'),loginForm:$('#login-form'),identifier:$('#identifier'),password:$('#password'),loginError:$('#login-error'),loginButton:$('#login-button'),logout:$('#logout'),editor:$('#editor'),form:$('#review-form'),list:$('#review-list'),filter:$('#status-filter'),toast:$('#toast')};
      const fields={id:$('#review-id'),title:$('#title'),category:$('#category'),service:$('#service-type'),region:$('#region'),author:$('#author'),rating:$('#rating'),sourceType:$('#source-type'),sortOrder:$('#sort-order'),body:$('#review-body'),image:$('#image-url'),source:$('#source-url'),published:$('#published')};
      const escapeHtml=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[c]);
      const isAdmin=(u)=>u?.app_metadata?.herihub_role==='admin'&&u?.is_anonymous!==true;
      const resolveEmail=(v)=>{const id=v.trim().toLowerCase();return id.includes('@')?id:`${id}@gmail.com`;};
      const toast=(m,error=false)=>{els.toast.textContent=m;els.toast.className=`fixed right-4 top-4 z-[70] max-w-sm px-4 py-3 text-sm font-bold text-white shadow-xl ${error?'bg-rose-700':'bg-emerald-700'}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>els.toast.classList.add('hidden'),3000);};
      const stats=()=>{$('#stat-total').textContent=reviews.length;$('#stat-draft').textContent=reviews.filter(r=>!r.is_published).length;$('#stat-published').textContent=reviews.filter(r=>r.is_published).length;};
      const render=()=>{const mode=els.filter.value;const rows=reviews.filter(r=>mode==='ALL'||(mode==='PUBLISHED'?r.is_published:!r.is_published));$('#result-count').textContent=`${rows.length}건`;els.list.innerHTML=rows.length?rows.map(r=>`<article class="grid gap-4 p-5 lg:grid-cols-[1fr_auto] lg:items-center"><div><div class="flex flex-wrap gap-2"><span class="bg-slate-100 px-2 py-1 text-xs font-black">${escapeHtml(r.service_type)}</span><span class="px-2 py-1 text-xs font-black ${r.is_published?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}">${r.is_published?'공개':'검수 대기'}</span></div><h4 class="mt-3 text-lg font-black">${escapeHtml(r.title)}</h4><p class="mt-2 line-clamp-2 text-sm leading-6 text-slate-600">${escapeHtml(r.review_body)}</p><p class="mt-2 text-xs font-bold text-slate-400">${escapeHtml(r.region)} · ${escapeHtml(r.author_label)} · ${escapeHtml(r.source_type)}</p></div><div class="flex gap-2"><button data-edit="${r.id}" class="min-h-10 border border-slate-300 px-3 text-sm font-black">수정</button><button data-toggle="${r.id}" class="min-h-10 px-3 text-sm font-black ${r.is_published?'bg-amber-100 text-amber-900':'bg-emerald-600 text-white'}">${r.is_published?'비공개':'공개'}</button><button data-delete="${r.id}" class="min-h-10 px-3 text-sm font-black text-rose-700">삭제</button></div></article>`).join(''):'<p class="p-10 text-center font-bold text-slate-500">표시할 후기가 없습니다.</p>';};
      const load=async()=>{const {data,error}=await client.schema('herihub').from('reviews').select('*').order('created_at',{ascending:false});if(error){console.error(error);toast('후기를 불러오지 못했습니다.',true);return;}reviews=data||[];stats();render();};
      const reset=()=>{els.form.reset();fields.id.value='';fields.author.value='고객님';fields.sortOrder.value='0';$('#editor-title').textContent='후기 작성';};
      const openEditor=(review=null)=>{reset();if(review){fields.id.value=review.id;fields.title.value=review.title;fields.category.value=review.category;fields.service.value=review.service_type;fields.region.value=review.region;fields.author.value=review.author_label;fields.rating.value=review.rating;fields.sourceType.value=review.source_type;fields.sortOrder.value=review.sort_order;fields.body.value=review.review_body;fields.image.value=review.image_url||'';fields.source.value=review.source_url||'';fields.published.checked=review.is_published;$('#editor-title').textContent='후기 수정';}els.editor.classList.remove('hidden');els.editor.scrollIntoView({behavior:'smooth',block:'start'});};
      const closeEditor=()=>{els.editor.classList.add('hidden');reset();};
      els.loginForm.addEventListener('submit',async e=>{e.preventDefault();els.loginButton.disabled=true;const {data,error}=await client.auth.signInWithPassword({email:resolveEmail(els.identifier.value),password:els.password.value});els.loginButton.disabled=false;if(error||!data.user||!isAdmin(data.user)){if(data.user)await client.auth.signOut();els.loginError.textContent='아이디, 비밀번호 또는 관리자 권한을 확인하세요.';els.loginError.classList.remove('hidden');return;}els.login.classList.add('hidden');els.app.classList.remove('hidden');load();});
      els.logout.addEventListener('click',async()=>{await client.auth.signOut();location.reload();});
      $('#new-review').addEventListener('click',()=>openEditor());$('#close-editor').addEventListener('click',closeEditor);$('#cancel-button').addEventListener('click',closeEditor);els.filter.addEventListener('change',render);
      els.form.addEventListener('submit',async e=>{e.preventDefault();const now=new Date().toISOString();const payload={title:fields.title.value.trim(),category:fields.category.value.trim(),service_type:fields.service.value,region:fields.region.value.trim(),review_body:fields.body.value.trim(),author_label:fields.author.value.trim(),rating:Number(fields.rating.value),image_url:fields.image.value.trim()||null,source_type:fields.sourceType.value,source_url:fields.source.value.trim()||null,is_published:fields.published.checked,published_at:fields.published.checked?(reviews.find(r=>r.id===fields.id.value)?.published_at||now):null,sort_order:Number(fields.sortOrder.value)||0,updated_at:now};const id=fields.id.value;const query=id?client.schema('herihub').from('reviews').update(payload).eq('id',id):client.schema('herihub').from('reviews').insert(payload);const {error}=await query;if(error){console.error(error);toast(`저장 실패: ${error.message}`,true);return;}toast('후기를 저장했습니다.');closeEditor();load();});
      els.list.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),toggle=e.target.closest('[data-toggle]'),del=e.target.closest('[data-delete]');if(edit){openEditor(reviews.find(r=>r.id===edit.dataset.edit));return;}if(toggle){const r=reviews.find(v=>v.id===toggle.dataset.toggle);const publish=!r.is_published;const {error}=await client.schema('herihub').from('reviews').update({is_published:publish,published_at:publish?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',r.id);if(error)toast('공개 상태 변경에 실패했습니다.',true);else{toast('공개 상태를 변경했습니다.');load();}return;}if(del&&confirm('이 후기를 삭제하시겠습니까?')){const {error}=await client.schema('herihub').from('reviews').delete().eq('id',del.dataset.delete);if(error)toast('삭제하지 못했습니다.',true);else{toast('후기를 삭제했습니다.');load();}}});
      const start=async()=>{const {data}=await client.auth.getSession();if(data.session){const {data:userData}=await client.auth.getUser();if(isAdmin(userData.user)){els.login.classList.add('hidden');els.app.classList.remove('hidden');load();}}};start();
    })();
  </script>
</body>
</html>
